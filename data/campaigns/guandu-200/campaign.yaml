# campaign.yaml — 官渡之战 数据草稿 v0（待审核，见 REVIEW.md）
id: guandu-200
schemaVersion: 1
status: draft
title: { zh: 官渡之战, en: Battle of Guandu }
subtitle:
  {
    zh: 公元 200 年（建安五年），曹操与袁绍在黄河南北的决战,
    en: 'Cao Cao versus Yuan Shao along the Yellow River, AD 200',
  }
summary: 东汉末年，袁绍兼并公孙瓒后拥有冀、青、幽、并四州，决心南攻曹操所在的许都。建安五年，曹操先东征刘备，随后在白马、延津以声东击西击杀袁军两员大将，又在官渡与袁军相持数月，最终亲率五千人夜袭乌巢、焚尽袁军粮谷，袁军大溃，袁绍渡河北逃，北方的力量对比从此改变。注意：史料只记到“月”，且用农历，页面上的时间均为月精度；东汉时黄河的河道在今道以北，经浚县、滑县一带，而底图上的黄河是今天的河道，仅作地形参照。本页数据为草稿，待审核。
mapNote: 底图上的黄河是今天的河道，仅作地形参照。东汉时的黄河在其以北（经今浚县、滑县一带）：黎阳在北岸，白马、延津、官渡都在南岸，所以图中箭头与今日河道的位置关系，不能当作当时的渡河路线。
