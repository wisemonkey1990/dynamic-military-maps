chapters:
  - id: ch1-prelude
    title: 战前：屯官渡，东征刘备
    start: 0200-01
    end: 0200-02
    hoursPerSecond: 240
    narration: 袁绍并公孙瓒，兼有四州，欲南攻许。曹操屯兵官渡，先东征刘备，刘备奔袁绍。
    camera:
      center: [115.6, 34.5]
      zoom: 7.5
  - id: ch2-baima-yanjin
    title: 白马、延津：声东击西
    start: 0200-03
    end: 0200-05
    hoursPerSecond: 120
    narration: 袁绍进军黎阳，遣颜良围白马。曹操用荀攸计，佯渡延津，兼行奔袭白马，关羽斩颜良；延津南又以辎重诱敌，斩文丑。
    camera:
      center: [114.4, 35.35]
      zoom: 9
  - id: ch3-standoff
    title: 官渡相持
    start: 0200-06
    end: 0200-10
    hoursPerSecond: 168
    narration: 双方在官渡对峙数月：袁军筑土山、挖地道，曹军造霹雳车、挖长堑；曹军粮尽，几欲退还，荀彧劝坚守。
    camera:
      center: [114.1, 34.9]
      zoom: 9.5
  - id: ch4-wuchao
    title: 乌巢：夜袭焚粮
    start: 0200-11
    end: 0200-11
    hoursPerSecond: 72
    narration: 许攸叛袁投曹，献策袭乌巢。曹操亲率五千人夜袭，焚尽袁军粮谷；张郃、高览来降，袁军大溃。
    camera:
      center: [114.2, 34.93]
      zoom: 9.5
  - id: ch5-aftermath
    title: 战后：袁军溃退
    start: 0200-12
    end: 0201-06
    hoursPerSecond: 240
    narration: 袁绍退至黎阳北岸，冀州城邑多降曹操；次年曹操又击破袁绍仓亭军。袁绍于建安七年忧死。
    camera:
      center: [114.7, 35.6]
      zoom: 8.5
