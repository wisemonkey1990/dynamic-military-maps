  title: 曹操军屯官渡
  body: 建安四年十二月，曹操军屯官渡。此前八月，曹操曾进军黎阳，派臧霸入青州，留于禁屯河上；九月还许，分兵守官渡。（农历建安四年十二月，折算见来源 cal-sxtwl）
  confidence: documented
