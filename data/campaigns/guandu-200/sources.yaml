- {
    id: cal-sxtwl,
    kind: reference,
    citation:
      农历到公历的折算：使用寿星万年历（sxtwl）的现代推算历法，取每个农历月“月中”所在的公历月。以《资治通鉴》“九月，庚午朔，日有食之”为锚点校验：推算得建安五年九月初一恰为庚午日（公历
      200 年 9 月 26 日），干支吻合。,
    note: 东汉实行四分历，与现代推算的朔日可能相差数日；本战役只用月精度，不受影响，但处于月初/月末的事件可能落到相邻公历月，请审核者留意。,
  }
