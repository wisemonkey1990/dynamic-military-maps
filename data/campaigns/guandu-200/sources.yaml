- {
    id: geo-estimate,
    kind: reference,
    citation:
      作者（起草者）依据古地名“今址”描述所作的估计坐标：白马（今滑县东北）、阳武（今原阳县东南）；乌巢、仓亭的具体位置本身有争议。未经查证，全部按
      approximate 或 conjectural 处理。,
    note: 审核时须逐点替换为有出处的坐标（如《中国历史地图集》东汉分册）。,
  }
