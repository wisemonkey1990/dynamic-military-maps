subtitle:
  {
    zh: 1944 年 6 月 5 日夜—12 日：D 日与滩头会师,
    en: 'D-Day, 5–12 June 1944: the landings and the linking of the beachheads',
  }
summary:
  1944 年 6 月 6 日（D 日），盟军在法国诺曼底发起“霸王行动”的登陆阶段（“海王行动”）。5 日夜里，英军第 6 空降师的滑翔机突击队夺下奥恩河桥，美军第 82、101 空降师空降在科唐坦半岛；拂晓前后，五个滩头——美军的犹他、奥马哈，英军的金、剑，加军的朱诺——依次登陆。德军的装甲预备队因请示延误，直到下午才发动反击，一度逼近海岸又被击退。之后的几天，盟军扩大滩头、夺取巴约和卡朗唐，12
  日五个滩头连成一片。本页 D 日（6 月 5 日夜至 6 日）按分钟展示，之后按天展示。钟点取自所引英文维基条目，钟点制式条目未说明；海上航渡的航线与时刻纯属示意。数据为草稿，待审核。
mapNote: 时刻取自所引英文维基条目，钟点制式条目未说明；各书对部分时刻说法不一（如空降、第 21 装甲师反击），已标为“大致”。海上航渡的航线与时刻纯属示意，不是舰队的实际航迹。
