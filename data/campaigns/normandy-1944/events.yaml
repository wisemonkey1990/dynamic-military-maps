  t: 1944-06-06T16:00
  until: 1944-06-06T20:00
  pos: [-0.37, 49.27]
  kind: battle
  title: 第 21 装甲师反击
  body:
    下午，第 21 装甲师趁剑、朱诺两滩之间的缺口发动反击，几乎打到海峡边，但遭第 3 师顽强抵抗，随后被召回去援助卡昂与巴约之间的地区。发动时间各书不一：主条目为 16:00，Sword 条目称“约 17:00
    分两路”（奥恩河东西各一路）。位置为示意。
