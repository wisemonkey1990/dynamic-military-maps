  t: 1944-06-06T00:16
  until: 1944-06-06T01:30
  pos: [-0.2744, 49.2422]
  kind: airdrop
  title: 夺取飞马桥与奥恩河桥
  body: 盟军在 D 日的第一个行动：约 00:16，六架滑翔机中的五架降落在两座桥附近（00:15–00:20），突击队出其不意，约十分钟内夺下卡昂运河桥（后称“飞马桥”）和奥恩河桥（后称“霍萨桥”），轻微伤亡。第六架因导航错误降在约七英里外。
  confidence: documented
