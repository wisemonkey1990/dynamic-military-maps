  title: 朱诺预备队投入
  body: 第 7、8 旅的预备队与皇家海军陆战队自 08:30 起投入，第 9 旅约 11:40 起投入；海滩及附近街道大半天塞满车辆，难以向内陆开进。
  confidence: documented
  units: [ca-3rd-div]
