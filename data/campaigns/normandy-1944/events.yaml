  body: 约在午夜前后，二千二百余架英、加、美轰炸机开始轰炸沿海及纵深目标；奥马哈一带因云层低、担心误伤己方，多数轰炸机推迟投弹，滩头防御大多没有被炸中。位置为示意，时刻“约午夜”。
