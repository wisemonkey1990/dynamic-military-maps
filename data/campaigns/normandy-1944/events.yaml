  t: 1944-06-06T03:30
  pos: [-0.2565, 49.2323]
  kind: airdrop
  title: 师部与反坦克炮乘滑翔机到达
  body: 第二批滑翔机（六十五架霍萨与四架哈米尔卡）约 03:20 降落，运来师部和一个反坦克炮连；师长盖尔在第三批滑翔机中约 03:30 抵达（两条目对批次的说法略有出入）。
  confidence: documented
  units: [uk-6th-airborne]
