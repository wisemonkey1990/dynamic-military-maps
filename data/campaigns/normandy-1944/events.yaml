  sources: [wp-landings, wp-stmere, geo-wiki, geo-osm, geo-estimate, cal-timezone]
- id: e-merville
  t: 1944-06-06T04:30
  until: 1944-06-06T06:00
  pos: [-0.1978, 49.2694]
  kind: battle
  title: 梅维尔炮台之战
  body:
    04:00 奥特韦带约 150 名伞兵抵达炮台，04:30 装有工兵的滑翔机到达，突击开始；炮台的火炮被塑胶炸药破坏，代价是 75 人伤亡。炮内是 75 毫米炮，而不是预料的 150 毫米重炮。摧毁的时限各书不一（Tonga
    条目称 05:30，主条目称 06:00）。
  confidence: documented
  units: [uk-9th-para]
  sources: [wp-tonga, wp-landings, geo-wiki, geo-osm, geo-estimate, cal-timezone]
- id: e-bombardment
  t: 1944-06-06T05:45
  until: 1944-06-06T06:30
  pos: [-0.9, 49.47]
  kind: battle
  title: 海军炮击开始
  body: 05:45，舰炮开始轰击海岸后方目标，05:50 天色够亮后转向预定的滩头目标。犹他、奥马哈的登陆比英军滩头早一小时，因此这两处只获得约 40 分钟海军炮击；犹他的空中轰炸预定 06:09–06:27。位置为示意。
  confidence: documented
  sources: [wp-landings, wp-utah, wp-omaha, geo-wiki, geo-osm, geo-estimate, cal-timezone]
- id: e-longues
  t: 1944-06-06T06:20
  until: 1944-06-06T07:15
  pos: [-0.6976, 49.3357]
  kind: battle
  title: 朗格斯炮台被炮火压制
  body: 06:20，巡洋舰的直接命中使朗格斯苏梅尔炮台四门炮中的三门失效；第四门下午间歇开火，其守军 7 日投降。位置取村镇中心，炮台在其附近。
  confidence: documented
  sources: [wp-gold, wp-landings, geo-wiki, geo-osm, geo-estimate, cal-timezone]
- id: e-utah-landing
  t: 1944-06-06T06:30
  until: 1944-06-06T07:30
  pos: [-1.1764, 49.4181]
  kind: landing
  title: 犹他海滩登陆
  body:
    06:30 H 时刻，第 4 步兵师第 8 步兵团分四波上岸。强流把登陆艇推到预定位置以南，这里反而只有一个据点，且被来自较低高度的轰炸破坏得更厉害；不少水下障碍物也已被冲到岸上。罗斯福准将决定“就从这里开始这场战争”，后续部队随之改道。DD
    坦克和工兵、爆破队随后到达，在海堤炸开缺口。
  confidence: documented
  units: [us-4th-div]
  sources: [wp-utah, wp-landings, geo-wiki, geo-osm, geo-estimate, cal-timezone]
- id: e-omaha-landing
  t: 1944-06-06T06:30
  until: 1944-06-06T07:30
  pos: [-0.8686, 49.3689]
  kind: landing
  title: 奥马哈海滩登陆
  body:
    06:30 H 时刻。奥马哈防御最强，对面是第 352 步兵师。强流把许多登陆艇推向东面或延误；美军轰炸机怕误伤登陆艇而推迟投弹，滩上障碍物大多完好。许多艇搁浅在沙洲上，士兵在没颈的水中涉水上岸。两个连的 DD
    坦克在离岸处放出，32 辆中有 27 辆进水沉没。
  confidence: documented
  units: [us-29th-div, us-1st-div]
  sources: [wp-omaha, wp-landings, geo-wiki, geo-osm, geo-estimate, cal-timezone]
- id: e-omaha-wave2
  t: 1944-06-06T07:00
  until: 1944-06-06T08:00
  pos: [-0.8686, 49.3689]
  kind: landing
  title: 奥马哈第二波登陆
  body: 07:00，规模更大的第二波带来增援、支援武器和指挥部，面对的困难与第一波几乎相同，只是德军火力被分散了些；07:35 前后德军第 726 团第 3 营已报告 100–200 名美军突破防线。
  confidence: documented
  sources: [wp-omaha, wp-landings, geo-wiki, geo-osm, geo-estimate, cal-timezone]
- id: e-pointe-landing
  t: 1944-06-06T07:10
  until: 1944-06-06T08:30
  pos: [-0.9889, 49.3958]
  kind: landing
  title: 游骑兵在角点崖脚登陆
  body:
    登陆艇因途中损失延误约 40 分钟，07:10 才抵达崖脚，人数约为出发时的一半。攀上悬崖后发现火炮已被撤走；游骑兵在南面果园找到了这些炮，并用炸药或燃烧手榴弹毁坏。7 日拂晓拉德尔只剩约 90 人可战，8
    日才有援兵到达。
  confidence: documented
  units: [us-2nd-rangers]
  sources: [wp-pointe, wp-landings, geo-wiki, geo-osm, geo-estimate, cal-timezone]
- id: e-gold-landing
  t: 1944-06-06T07:25
  until: 1944-06-06T08:25
  pos: [-0.5717, 49.3453]
  kind: landing
  title: 金滩登陆
  body:
    海军炮击自 05:30 开始，两栖登陆 07:25 开始；DD 坦克预定 07:20 先到。大风使登陆艇难以操作，DD 坦克在近岸甚至直接在滩上放出。勒阿梅尔据点面朝东、有厚混凝土墙，空袭未能命中，其 75
    毫米炮一直打到 16:00；拉里维耶尔的 88 毫米炮 07:30 被坦克压制。
  confidence: documented
  units: [uk-50th-div]
  sources: [wp-gold, wp-landings, geo-wiki, geo-osm, geo-estimate, cal-timezone]
- id: e-sword-landing
  t: 1944-06-06T07:30
  until: 1944-06-06T08:30
  pos: [-0.3211, 49.3064]
  kind: landing
  title: 剑滩登陆
  body: 步兵约 07:30 开始下船（预定 07:25）。25 辆首波 DD 坦克中 21 辆抵达；海滩布满地雷与障碍，涨潮比预期快，滩头很快拥挤。洛瓦特的第 1 特勤旅在第二波上岸，第 4 突击队穿过乌伊斯特勒昂从后面攻击岸炮台；菲利普·基弗指挥的自由法国突击队清剿了里瓦贝拉赌场的据点。
  confidence: documented
  units: [uk-3rd-div, uk-1st-ssb]
  sources: [wp-sword, wp-landings, geo-wiki, geo-osm, geo-estimate, cal-timezone]
- id: e-juno-landing
  t: 1944-06-06T07:35
  until: 1944-06-06T08:35
  pos: [-0.4153, 49.3353]
  kind: landing
  title: 朱诺海滩登陆
  body: 因海况，首波推迟到 07:35 上岸，步兵先于装甲，登岸时伤亡不小；大部分海上炮击没有命中德军阵地。库尔瑟勒、圣欧班、贝尔尼埃的据点须逐屋清剿。约两小时内，兵力、协调的炮火与装甲中队清除了大部分沿海防御。
  confidence: documented
  units: [ca-3rd-div]
  sources: [wp-juno, wp-landings, geo-wiki, geo-osm, geo-estimate, cal-timezone]
- id: e-omaha-cota
  t: 1944-06-06T07:50
  until: 1944-06-06T09:00
  pos: [-0.888, 49.3715]
  kind: battle
  title: 科塔带头突破
  body: 07:50，第 29 师助理师长科塔准将在多格白滩，用爆破筒和剪线钳破开铁丝网，带头冲出海滩；二十分钟后第 5 游骑兵营加入。零散的、常来自不同连甚至不同师的小股人马，在被“鼓励或逼迫”之下向崖上推进。
  confidence: documented
  units: [us-29th-div]
  sources: [wp-omaha, geo-wiki, geo-osm, geo-estimate, cal-timezone]
