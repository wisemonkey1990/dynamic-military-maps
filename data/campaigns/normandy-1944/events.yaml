  body: 主条目称扫雷舰在午夜后不久开始为舰队清扫航道，至天亮后才完成，没有遇到敌人；Utah 条目则称“6 月 5 日傍晚”开始，两说不一，取“午夜前后”，位置为示意。
  confidence: approximate
