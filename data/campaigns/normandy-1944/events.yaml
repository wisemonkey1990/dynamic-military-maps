  kind: other
  title: 奥马哈暂停车辆登陆
  body: 清障困难，海滩指挥官在 08:30 下令暂停车辆继续登陆；这时有一批驱逐舰赶到，以火力支援，登陆得以恢复。
  confidence: documented
  sources: [wp-landings, geo-wiki, geo-osm, geo-estimate, cal-timezone]
