  kind: march
  title: 犹他战斗队离开海滩
  body: 约 09:00，战斗队开始离开海滩，有的步兵涉过被淹没的田野而不走唯一的公路；一路上与德军第 919 掷弹兵团的一部交火。主要据点与南面另一个据点约在正午被压制。位置为示意。
  confidence: documented
  units: [us-4th-div]
  sources: [wp-utah, wp-landings, geo-wiki, geo-osm, geo-estimate, cal-timezone]
