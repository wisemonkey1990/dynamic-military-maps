  t: 1944-06-06T04:30
  pos: [-1.3181, 49.4089]
  kind: occupation
  title: 夺取圣母教堂镇
  body: 第 82 空降师东岸的团在空降后约两小时内夺取了这个重要路口，它是入侵中首个解放的城镇之一。时刻为据“两小时内”推定。
  confidence: reconstructed
