  body: 00:15，美军引导员抵达。浓云使导航困难，五个伞兵降落区中只有一个被雷达信号和信号灯准确标出。运输机为避开舰队，自西越过科唐坦半岛飞入，再从犹他海滩上空飞出。位置为示意。
