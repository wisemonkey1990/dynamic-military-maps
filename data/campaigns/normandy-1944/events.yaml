  kind: battle
  title: 登上奥马哈崖顶
  body: 游骑兵、第 116 团的小股人马和其他部队陆续攻上崖顶，到约 09:00 有六百多名美军已在高地上（主条目称“上午晚些时候”，故时刻标为大致）；他们拿下 WN-70 后开始向内陆推进。此前海滩上的伤员在涨潮中溺亡，登陆艇被炮火击中起火。
  confidence: approximate
  sources: [wp-omaha, wp-landings, geo-wiki, geo-osm, geo-estimate, cal-timezone]
