- id: e-6ab-drop
  t: 1944-06-06T00:50
  pos: [-0.2565, 49.2323]
  kind: airdrop
  title: 英军第 6 空降师主力空降
  body: 00:50，英军伞兵开始降落。为其标示降落区的引导员被吹偏，把导航标志设在过于偏东处，许多伞兵也被吹得太远，有的数小时甚至数天后才归建。第 3 伞兵旅炸毁了迪沃河上的五座桥。位置取朗维尔一带为示意。
  confidence: documented
  units: [uk-6th-airborne]
  sources: [wp-tonga, wp-landings, geo-wiki, geo-osm, geo-estimate, cal-timezone]
- id: e-german-alert
  t: 1944-06-06T02:00
  pos: [-0.3636, 49.1813]
  kind: other
  title: 德军的最初反应
  body:
    01:20，德军第 7 集团军接到伞兵空降的报告，但伦德施泰特起初不相信这是大规模入侵；02:00 前后德军才发现逼近的舰队（沿岸雷达站在前一周已被炸毁）。同一时间，第 716 师师长要求福伊希廷格出动第 21
    装甲师，但后者属装甲预备队，须先请示最高统帅部。位置取卡昂为示意。
  confidence: approximate
  units: [de-21st-panzer]
  sources: [wp-landings, wp-21pz, geo-wiki, geo-osm, geo-estimate, cal-timezone]
- id: e-101st-drop
  t: 1944-06-06T01:30
  pos: [-1.23, 49.38]
  kind: airdrop
  title: 第 101 空降师空降
  body:
    约 01:30 起，第 101 空降师开始在犹他海滩后方空降，任务是控制堤道、炸毁杜夫河桥梁。C-47 在浓云中无法保持队形，低飞受到高射炮和机枪射击；一些伞兵摔死或淹死在被淹没的田野里，聚拢成建制部队因缺电台和树篱地形而很难；有的营直到下午才到达目标，此时几条堤道已被第
    4 步兵师从海滩上夺取。
  confidence: documented
  units: [us-101st]
  sources: [wp-landings, wp-utah, geo-wiki, geo-osm, geo-estimate, cal-timezone]
- id: e-82nd-drop
  t: 1944-06-06T02:30
  pos: [-1.34, 49.405]
  kind: airdrop
  title: 第 82 空降师空降
  body: 约 02:30 起，第 82 空降师开始空降，首要目标是默德雷河上的两座桥并炸毁杜夫河上的两座桥。东岸的空降兵大多降在目标区附近，西岸两个团则极为分散，许多降在沼泽里；他们夺取但没能守住拉菲耶尔桥。位置取降落区大致中心为示意。
  confidence: documented
  units: [us-82nd]
  sources: [wp-landings, geo-wiki, geo-osm, geo-estimate, cal-timezone]
