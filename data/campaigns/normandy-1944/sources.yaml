- {
    id: geo-osm,
    kind: reference,
    citation:
      其余村镇的坐标经 OpenStreetMap Nominatim 检索（乌伊斯特勒昂、利翁苏梅尔、朗格斯苏梅尔、勒阿梅尔、贝桑港、圣科姆迪蒙、伊尼、朗维尔、科勒维尔、维耶维尔、卡昂、塔兰特拉什顿等）。©
      OpenStreetMap contributors,
    url: 'https://www.openstreetmap.org/copyright',
    license: ODbL 1.0,
    note: 取的是今日村镇中心点，与当年的具体据点、炮台、桥梁的位置可能相差数百米到数公里。,
  }
- {
    id: geo-estimate,
    kind: reference,
    citation:
      作者（起草者）依据条目文字描述所作的估计坐标与时刻：舰队航渡与换乘区、登陆艇的出发点、各降落区中心、若干“示意”点位。全部按 approximate
      或 conjectural 处理。,
    note: 审核时应逐点替换为有出处的位置（如美国陆军军事历史中心的战史地图、英国官方战史地图）。,
  }
