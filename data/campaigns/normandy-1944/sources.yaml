- {
    id: cal-timezone,
    kind: reference,
    citation: 钟点制式：所引维基条目都没有说明时区。本数据的时刻一律按条目原样记录，不做任何换算。,
    note:
      '起草者的背景知识（未在所引条目中核实）：盟军当时使用英国双夏令时（GMT+2）。若如此，界面显示的就是盟军的钟点，与法国当地太阳时、德军钟点各差一到两小时；德军方面的时刻（如
      02:00、09:00）可能采用另一种制式。请审核者对照原始战史确认。',
  }
