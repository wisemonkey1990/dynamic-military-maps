title: { zh: 四渡赤水, en: Four Crossings of the Chishui River }
subtitle:
  {
    zh: 1935 年 1 月—5 月，中央红军在川黔滇边的机动作战,
    en: 'Central Red Army maneuvers in the Sichuan-Guizhou-Yunnan borderlands,
      Jan–May 1935',
  }
summary: 遵义会议后，中央红军（约三万人）计划北渡长江，与红四方面军会合。土城一战受挫后，红军四次往返渡过赤水河，在数十万国民党军的围追堵截之间穿插机动：重占遵义、痛击吴奇伟纵队，又佯攻贵阳、调动滇军，最终南渡乌江、西进云南、巧渡金沙江，摆脱了被围歼的危险。本页数据为草稿，各条目的时间、地点与可信度见图例，待审核。
period: { start: '1935-01-19', end: '1935-05-09' }
