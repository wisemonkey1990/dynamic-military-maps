  body: 红军各部进攻周浑元纵队在鲁班场的工事，双方展开白刃战。当晚吴奇伟纵队抵达枫香坝、川军郭勋祺部抵达两河口驰援，形成夹击之势，军委下令撤出战斗。红军伤亡数字见于回忆和媒体文章，待核，此处不采信。
  confidence: documented
