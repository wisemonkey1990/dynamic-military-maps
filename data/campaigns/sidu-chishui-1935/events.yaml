- id: battle-tucheng
  t: '1935-01-28'
  until: '1935-01-29'
  pos: [105.993, 28.284]
  kind: battle
  title: 土城战役（青杠坡战斗）
  body: 红三、红五军团在彭德怀指挥下进攻枫村坝、青杠坡的川军郭勋祺旅，随后潘佐旅赶到合兵反击。红军原判断川军仅四个团，实际约六个团一万余人；朱德到红五军团指挥所指挥反击，毛泽东投入干部团后击退川军。激战一日，双方损失惨重，夺取赤水城、北渡长江的计划未能实现。红军伤亡数字各书不一（常见说法为四千余人），此处不采信具体数字。
  confidence: documented
  units: [red-3rd-corps, red-5th-corps, sc-guo-pan]
  sources: *id001
