  title: 南渡乌江
  body: 3 月 28 日红军主力进入乌江北部，29 日红一师第 3 团夺取乌江渡口，30—31 日主力南渡乌江，进入息烽西北的黄冈、牛场等地。红九军团因渡口被阻断，被迫独立行动。渡口名称与位置（江界河等）待核，此处位置为示意。
