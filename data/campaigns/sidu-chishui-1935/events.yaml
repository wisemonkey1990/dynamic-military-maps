  sources: *id001
- id: battle-zunyi
  t: '1935-02-27'
  until: '1935-03-01'
  pos: [106.927, 27.725]
  kind: battle
  title: 遵义战役
  body:
    2 月 27 日黄昏红军攻入遵义新城，红三军团参谋长邓萍在观察部署时牺牲；28 日凌晨占领老城。28 日红三军团固守老鸦山、红花岗，红一军团迂回攻击吴奇伟指挥部，吴奇伟纵队败退乌江南岸，被红军俘获一千余人及大批辎重，第
    59、93 师大部被歼。红军称之为长征以来最大的一次胜利。俘获与歼灭的具体数字各书不一，此处不采信。
  confidence: documented
  units: [red-1st-corps, red-3rd-corps, cn-wu-qiwei]
  sources: *id001
