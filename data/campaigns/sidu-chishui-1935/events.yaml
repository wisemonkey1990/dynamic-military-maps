  title: 苟坝会议
  body: 3 月 10 日军委纵队进驻苟坝。政治局会议讨论是否攻打打鼓新场，多数人主张进攻，毛泽东反对；会后毛泽东说服周恩来，11 日会议改变决定并恢复其前敌政委职务。12 日会议决定成立三人军事指挥小组。会议细节据回忆和后人研究，说法不完全一致，待核。
  confidence: documented
  sources: *id001
