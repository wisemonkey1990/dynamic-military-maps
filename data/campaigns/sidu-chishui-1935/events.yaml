- id: battle-loushanguan
  t: '1935-02-25'
  until: '1935-02-26'
  pos: [106.854, 28.026]
  kind: battle
  title: 娄山关战斗
  body: 黔军第 1 旅旅长杜肇华率部死守娄山关，等待中央军吴奇伟纵队。红三军团为主攻，红十三团与黔军拉锯，红十二团正面进攻，红十、十三团迂回两侧，红十一团奔袭板桥切断退路，黔军溃败。毛泽东后来作《忆秦娥·娄山关》。
  confidence: documented
